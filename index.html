<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'">
<title>Jin Assessment Studio</title>
<link rel="icon" href="assets/app-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></symbol>
    <symbol id="i-build" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-bank" viewBox="0 0 24 24"><path d="M4 6.5C4 5 7.6 4 12 4s8 1 8 2.5S16.4 9 12 9 4 8 4 6.5Z"/><path d="M4 6.5v5C4 13 7.6 14 12 14s8-1 8-2.5v-5"/><path d="M4 11.5v5C4 18 7.6 19 12 19s8-1 8-2.5v-5"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="M3.5 9h17M3.5 14.5h17M9.5 4v16M15 4v16"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v-5M11 16V7M15 16v-7M19 16V5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 9.5l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4.5l2 2.5H19a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 19.5H5A1.5 1.5 0 0 1 3.5 18z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7Z"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="18" r="1.2"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4.5 17.5 5-5 4 4 2.5-2.5 3.5 3.5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5V8h4"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H4.5V10h15v7H17"/><path d="M7 14h10v6H7z"/></symbol>
    <symbol id="i-wand" viewBox="0 0 24 24"><path d="m4 20 11-11M14 4v3M19 9h-3M17.5 5.5 16 7M12.5 4.5l.8 1.2M19.5 11.5l-1.2-.8"/><path d="m13 7 4 4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 7.5A8 8 0 1 0 20 12"/><path d="M19.5 3.5v4.5H15"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14v10H10l-4 4v-4H5z"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 8.5 4.5L12 13 3.5 8.5z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/></symbol>
  </defs>
</svg>

<header class="top" id="top">
  <div class="brandmark" aria-hidden="true"><span><svg class="i"><use href="#i-spark"/></svg></span></div>
  <div class="brand"><b>JIN</b> ASSESSMENT STUDIO <span class="brand-sub">/ TEACHER WORKSPACE</span></div>
  <div class="topright">
    <span class="status" id="save-status"><i class="dot"></i><span>All changes saved</span></span>
    <button class="pill" id="top-exam-pill" data-a="goto" data-screen="exam" title="Open the current exam">—</button>
    <div class="avatar" id="avatar" title="Teacher">T</div>
  </div>
</header>

<div class="shell">
  <div class="hero">
    <div>
      <div class="eyebrow" id="hero-eyebrow">ASSESSMENT DESIGN SYSTEM</div>
      <h1>Exam Operations</h1>
      <div class="sub">Build, review, and analyze assessments from one workspace.</div>
    </div>
    <div class="actions">
      <button class="btn" data-a="backup"><svg class="i"><use href="#i-download"/></svg>Save backup</button>
      <button class="btn" data-a="restore"><svg class="i"><use href="#i-upload"/></svg>Restore backup</button>
      <button class="btn gold" data-a="new-exam"><svg class="i"><use href="#i-plus"/></svg>New exam</button>
    </div>
  </div>

  <div class="layout">
    <aside class="side" id="side">
      <div class="sidehead">Workspace</div>
      <nav id="nav">
        <button class="nav active" data-screen="overview"><svg class="i"><use href="#i-home"/></svg>Overview</button>
        <button class="nav" data-screen="exam"><svg class="i"><use href="#i-build"/></svg>Exam</button>
        <button class="nav" data-screen="bank"><svg class="i"><use href="#i-bank"/></svg>Item Bank<span class="navcount" id="nav-bank-count">0</span></button>
        <button class="nav" data-screen="comps"><svg class="i"><use href="#i-target"/></svg>Competencies</button>
        <button class="nav" data-screen="tos"><svg class="i"><use href="#i-grid"/></svg>TOS</button>
        <button class="nav" data-screen="analysis"><svg class="i"><use href="#i-chart"/></svg>Item Analysis</button>
        <button class="nav" data-screen="settings"><svg class="i"><use href="#i-gear"/></svg>Settings</button>
      </nav>
      <div class="current-exam" id="current-exam" data-a="goto" data-screen="exam" role="button" tabindex="0"></div>
    </aside>

    <main class="workspace" id="workspace">
      <section class="screen active" id="screen-overview"></section>
      <section class="screen" id="screen-exam"></section>
      <section class="screen" id="screen-bank"></section>
      <section class="screen" id="screen-comps"></section>
      <section class="screen" id="screen-tos"></section>
      <section class="screen" id="screen-analysis"></section>
      <section class="screen" id="screen-settings"></section>
    </main>
  </div>
</div>

<button class="assistant-toggle" id="assistant-toggle" type="button" data-a="assistant" aria-label="Open Jin assistant" title="Ask Jin">
  <span class="assistant-face"><img src="assets/jin/anime-planning-face.webp" alt=""></span>
  <span class="assistant-spark"><svg class="i"><use href="#i-spark"/></svg></span>
</button>
<section class="assistant-panel" id="assistant" aria-label="Jin assistant" aria-hidden="true"></section>

<div class="modal-root" id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="file-pick" hidden>

<script src="vendor/docx.iife.js"></script>
<script src="js/web-host.js"></script>
<script src="js/core.js"></script>
<script src="js/office.js"></script>
<script src="js/classify.js"></script>
<script src="js/exam.js"></script>
<script src="js/bank.js"></script>
<script src="js/comps.js"></script>
<script src="js/tos.js"></script>
<script src="js/analysis.js"></script>
<script src="js/planner.js"></script>
<script src="js/jin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
